# Phase 2 Model & Early Warning System Configuration

forecasting:
  horizons: [7, 15, 30]
  target_col: "price_rs_per_qtl"
  group_cols: ["state", "district", "market"]
  random_seed: 42

lightgbm:
  objective: "regression"
  metric: "rmse"
  boosting_type: "gbdt"
  learning_rate: 0.05
  n_estimators: 100
  num_leaves: 31
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 5

arima:
  order: [1, 1, 1]
  seasonal_order: [1, 0, 0, 7]
  trend: "c"

early_warning:
  zscore_threshold_warning: 1.2
  zscore_threshold_high_risk: 2.0
  expected_change_percent_warning: 3.0
  expected_change_percent_high_risk: 6.0
  volatility_window: 30
  volatility_threshold_high: 0.015

split:
  train_year: 2024
  val_year: 2025
  test_year: 2026
